  <!-- Tiny 40KB Instant jsQR Scanner for Thai Bank Slip QR payloads -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- Tesseract.js OCR for Thai/Eng Bank Slip Text Recognition Fallback -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    window.parseSlipOCR = async function(base64Image) {
      console.log("⚡ Starting Instant Slip Scan...");

      // 1. Ultra-fast QR Code Payload Decoding (0.01s Instant Detection)
      try {
        const img = new Image();
        img.src = base64Image;
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });

        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        if (window.jsQR) {
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code && code.data) {
            console.log("🎉 Instant QR Code Scanned:", code.data);
            // EMVCo / Thai Bank Slip standard Tag 54 is Amount
            // Tag 54 format: ...5406130.00... or ...540550.00...
            const tag54Index = code.data.indexOf("54");
            if (tag54Index !== -1) {
              const lenStr = code.data.substring(tag54Index + 2, tag54Index + 4);
              const len = parseInt(lenStr, 10);
              if (!isNaN(len) && len > 0 && len <= 12) {
                const amtStr = code.data.substring(tag54Index + 4, tag54Index + 4 + len);
                console.log("✨ Extracted Amount from Slip QR Tag 54:", amtStr);
                return "จำนวนเงิน " + amtStr + " บาท\n" + code.data;
              }
            }
            return code.data;
          }
        }
      } catch (qrErr) {
        console.warn("QR Scan Exception:", qrErr);
      }

      // 2. Tesseract OCR Fallback (if no QR code on slip)
      try {
        if (window.Tesseract) {
          const worker = await Tesseract.createWorker('eng');
          const ret = await worker.recognize(base64Image);
          await worker.terminate();
          console.log("✅ OCR Fallback Extracted Text:\n", ret.data.text);
          return ret.data.text || "";
        }
      } catch (e) {
        console.error("❌ OCR Fallback Error:", e);
      }
      return "";
    };
  </script>
