  <!-- Tiny 40KB Instant jsQR Scanner for Thai Bank Slip QR payloads -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- Tesseract.js OCR for Thai/Eng Bank Slip Text Recognition Fallback -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    // Strict EMVCo TLV Parser (Tag-Length-Value) to prevent picking fake "54" inside Ref IDs
    function parseEMVCoTags(qrData) {
      let idx = 0;
      const tags = {};
      while (idx < qrData.length - 4) {
        const tag = qrData.substring(idx, idx + 2);
        const len = parseInt(qrData.substring(idx + 2, idx + 4), 10);
        if (isNaN(len) || len < 0 || idx + 4 + len > qrData.length) break;
        const val = qrData.substring(idx + 4, idx + 4 + len);
        tags[tag] = val;
        idx += 4 + len;
      }
      return tags;
    }

    window.parseSlipOCR = async function(base64Image) {
      console.log("⚡ Starting Instant Slip Scan...");

      // 1. Ultra-fast QR Code TLV Decoding (0.01s Instant Detection)
      try {
        const img = new Image();
        img.src = base64Image;
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });

        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        if (window.jsQR) {
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code && code.data) {
            console.log("🎉 Instant QR Code Scanned:", code.data);

            // Parse EMVCo tags strictly
            if (code.data.startsWith("0002")) {
              const tags = parseEMVCoTags(code.data);
              if (tags["54"]) {
                const amt = parseFloat(tags["54"]);
                if (!isNaN(amt) && amt > 0 && amt < 1000000) {
                  console.log("✨ Strict EMVCo Tag 54 Amount Extracted:", amt);
                  return "จำนวนเงิน " + amt.toFixed(2) + " บาท\n" + code.data;
                }
              }
            }
          }
        }
      } catch (qrErr) {
        console.warn("QR Scan Exception:", qrErr);
      }

      // 2. Tesseract OCR Fallback (if no QR code or non-EMVCo QR)
      try {
        if (window.Tesseract) {
          const worker = await Tesseract.createWorker('eng');
          const ret = await worker.recognize(base64Image);
          await worker.terminate();
          console.log("✅ OCR Fallback Extracted Text:\n", ret.data.text);
          return ret.data.text || "";
        }
      } catch (e) {
        console.error("❌ OCR Fallback Error:", e);
      }
      return "";
    };
  </script>
