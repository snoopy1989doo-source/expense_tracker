  <!-- Tesseract.js OCR for Thai/Eng Bank Slip Text Recognition -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    window.parseSlipOCR = async function(base64Image) {
      console.log("🤖 Starting OCR Slip scan...");
      try {
        // Fast OCR worker using eng for 100% reliable 0-9 number & slip code recognition (< 1s)
        const worker = await Tesseract.createWorker('eng', 1, {
          logger: m => console.log("OCR Progress:", m)
        });
        const ret = await worker.recognize(base64Image);
        await worker.terminate();
        console.log("✅ OCR Extracted Text Result:\n", ret.data.text);
        return ret.data.text || "";
      } catch (e) {
        console.error("❌ Primary OCR Error:", e);
        try {
          // Retry fallback
          const workerFallback = await Tesseract.createWorker('eng');
          const retFallback = await workerFallback.recognize(base64Image);
          await workerFallback.terminate();
          return retFallback.data.text || "";
        } catch (err) {
          console.error("❌ Fallback OCR Error:", err);
          return "";
        }
      }
    };
  </script>
